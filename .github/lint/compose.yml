# The linter images ci.yml runs; why they live here is in docs/agents/ci.md.
# Relative paths resolve from this file's directory, so ../.. is the repo root.
services:
  actionlint:
    image: rhysd/actionlint:1.7.12
    volumes:
      - ../..:/repo
    working_dir: /repo

  shellcheck:
    image: koalaman/shellcheck:v0.11.0
    volumes:
      - ../..:/mnt
    working_dir: /mnt

  # check-jsonschema has no official image, so it is pip-installed from the pin in
  # requirements.txt, which Dependabot bumps too.
  dependabot-schema:
    image: python:3.14.8-slim-trixie
    volumes:
      - ../..:/repo
    working_dir: /repo
    environment:
      PIP_ROOT_USER_ACTION: ignore
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    entrypoint:
      - sh
      - -c
      - >-
        pip install --quiet --no-cache-dir -r .github/lint/requirements.txt &&
        check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml
