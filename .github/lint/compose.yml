# The linter images CI runs, pinned here so Dependabot's docker-compose ecosystem can bump them.
# Relative paths resolve from this file's directory, so ../.. is the repo root.
services:
  actionlint:
    image: rhysd/actionlint:1.7.12
    volumes:
      - ../..:/repo
    working_dir: /repo

  shellcheck:
    image: koalaman/shellcheck:v0.11.0
    volumes:
      - ../..:/mnt
    working_dir: /mnt
