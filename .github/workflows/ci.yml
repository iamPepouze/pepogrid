name: CI

on:
  pull_request:
    branches: [main]
  # Called by image.yml so main is built with exactly the checks PRs must pass.
  workflow_call:

permissions:
  contents: read

# A new push to a PR supersedes its running check; the check image.yml runs on main is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job name "check" is the required status check in the main ruleset.
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: test-seeds.sh diffs against the merge base with origin/main.
          fetch-depth: 0
      # A run on main itself has no PR branch to name.
      - name: Check branch name
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: scripts/check-branch-name.sh "$BRANCH"
      # The linter images are pinned in .github/lint/compose.yml, where Dependabot bumps them.
      - name: Lint workflows
        run: docker compose -f .github/lint/compose.yml run --rm actionlint -color
      - name: Lint shell scripts
        run: docker compose -f .github/lint/compose.yml run --rm shellcheck scripts/*.sh .githooks/pre-push
      - name: Validate dependabot.yml
        run: docker compose -f .github/lint/compose.yml run --rm dependabot-schema
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run contrast
      - run: npm test
      # Only a PR has changes against main to rerun.
      - name: Rerun changed tests under fixed seeds
        if: github.event_name == 'pull_request'
        run: scripts/test-seeds.sh origin/main
      - run: npm run build
