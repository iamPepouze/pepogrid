name: CI

on:
  pull_request:
    branches: [main]
  # Called by deploy.yml so main is built with exactly the checks PRs must pass.
  workflow_call:
    inputs:
      upload-pages:
        description: Upload dist as the GitHub Pages artifact
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a PR supersedes its running check; a deploy's check is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job name "check" is the required status check in the main ruleset.
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: test-seeds.sh diffs against the merge base with origin/main.
          fetch-depth: 0
      # The linter images are pinned in .github/lint/compose.yml, where Dependabot bumps them.
      - name: Lint workflows
        run: docker compose -f .github/lint/compose.yml run --rm actionlint -color
      - name: Lint shell scripts
        run: docker compose -f .github/lint/compose.yml run --rm shellcheck scripts/*.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Only a PR has changes against main to rerun; a deploy builds main itself.
      - name: Rerun changed tests under fixed seeds
        if: github.event_name == 'pull_request'
        run: scripts/test-seeds.sh origin/main
      - run: npm run build
      - if: inputs.upload-pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
