name: Publish image

on:
  push:
    branches: [main]
  # A PR that touches the image runs everything except the push, since nothing else builds the Dockerfile before main.
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - nginx.conf
      - scripts/smoke-image.sh
      - .github/workflows/image.yml
      - vite.config.ts
      - package-lock.json

permissions:
  contents: read

# One publish at a time; let a running one finish rather than cancel it. GitHub keeps only the newest waiting run,
# so a burst of pushes publishes the first and the last, and skips the commits between: the newest image is what counts.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/iampepouze/pepogrid

jobs:
  # The same checks a PR must pass. deploy.yml runs them too, so a failed Pages deploy never blocks the image.
  check:
    # A PR already has its own check run.
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  image:
    needs: check
    # check is skipped on a PR, which would skip this job too.
    if: ${{ !failure() && !cancelled() }}
    # Built natively: the Cluster runs linux/arm64 only, so there is no emulation and no other platform.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build --platform linux/arm64 --tag "$IMAGE:candidate" .
      - name: Run the container
        run: docker run --detach --name pepogrid --publish 8080:8080 "$IMAGE:candidate"
      - name: Check the container does not run as root
        run: |
          user=$(docker inspect --format '{{.Config.User}}' pepogrid)
          uid=$(docker exec pepogrid id -u)
          echo "Config.User=$user, running as uid $uid"
          [ "$uid" != 0 ] && [[ "$user" =~ ^[0-9]+$ ]] && [ "$user" != 0 ]
      - name: Smoke check
        run: |
          for _ in $(seq 30); do
            curl -fs -o /dev/null http://localhost:8080/ && break
            sleep 1
          done
          scripts/smoke-image.sh http://localhost:8080
      - name: Show the container's log on failure
        if: failure()
        run: docker logs pepogrid
      # Only now, with every check green, does anything leave the runner.
      - name: Push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="main-$(date +%s)-${GITHUB_SHA::7}"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE:candidate" "$IMAGE:$tag"
          docker push "$IMAGE:$tag"
          echo "Pushed $IMAGE:$tag" >> "$GITHUB_STEP_SUMMARY"
