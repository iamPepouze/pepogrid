# The one server of the container image (Dockerfile). The unprivileged image listens above 1024.
# Each location sets its own Cache-Control.
server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # A location's add_header would otherwise replace the server's, dropping the CSP below; merge (nginx 1.29.3+, and
  # the Dockerfile's image is 1.31.7) adds it to each location's own headers:
  # https://nginx.org/en/docs/http/ngx_http_headers_module.html#add_header_inherit
  add_header_inherit merge;

  # The Server adds the other security headers but no CSP: another Project behind it, sprichoida.lallard.com, gets
  # Strict-Transport-Security, X-Content-Type-Options, X-Frame-Options, Referrer-Policy and Permissions-Policy, and no
  # Content-Security-Policy (observed 2026-10-30). Only this origin may load
  # anything; the hash is index.html's early theme-and-language script, so editing that script means updating it
  # (scripts/smoke-image.sh fails until the two match). `always` covers error responses too.
  # Directives: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Content-Security-Policy
  add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-JONaQJ8Wxtts4w7E6uk7/n7t3fgJ4Kg7ukR6RXUpaWM='; style-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # No fallback to index.html: the app has no routes, so an unknown path is a 404.
  location / {
    try_files $uri $uri/ =404;
  }

  # What the app and its update check start from: always revalidated, or players would never see a new version.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache";
  }

  # Hashed by Vite, so a new build names new files. ^~ keeps the icon regex below from taking its .svg and .png.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Icons keep their names across builds, so they are long-lived but not immutable.
  location ~* \.(png|svg)$ {
    add_header Cache-Control "public, max-age=31536000";
  }
}
