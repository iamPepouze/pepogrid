# The one server of the container image (Dockerfile). The unprivileged image listens above 1024.
# A location's add_header replaces the server's, so each location sets its own Cache-Control.
server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # No fallback to index.html: the app has no routes, so an unknown path is a 404.
  location / {
    try_files $uri =404;
  }

  # What the app and its update check start from: always revalidated, or players would never see a new version.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache";
  }

  # Hashed by Vite, so a new build names new files.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Icons keep their names across builds, so they are long-lived but not immutable.
  location ~* \.(png|svg)$ {
    add_header Cache-Control "public, max-age=31536000";
  }
}
