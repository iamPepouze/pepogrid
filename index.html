<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Your grid, your chill." />
    <meta name="theme-color" content="#1565c0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PepoGrid" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>PepoGrid</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      // Keep in sync with src/composables/useTheme.ts.
      ;(function () {
        try {
          var mode = localStorage.getItem('pepogrid:theme')
          if (mode === 'light' || mode === 'dark') document.documentElement.dataset.theme = mode
          var dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1e1e1e')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
